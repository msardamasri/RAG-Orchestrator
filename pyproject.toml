[project]
name = "ragcore"
version = "0.2.0"
description = "A small, pluggable RAG baseline: hybrid retrieval, reranking, grounded answers with citations, conversation memory and an offline evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.3"]
openai = ["openai>=1.50"]
qdrant = ["qdrant-client>=1.12"]
ragas = ["ragas>=0.2", "datasets>=3.0", "langchain-openai>=0.2"]
examples = ["fastapi>=0.115", "inngest>=0.5.13", "plotly>=5.24", "python-dotenv>=1.0", "streamlit>=1.40", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ragcore = "ragcore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
